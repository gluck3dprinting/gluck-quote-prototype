/* ─── 견적 공식 (글룩 확정) ───
 *   price = Math.round(volumeCm3 * 1.27 * unitPrice / 1000) * 1000
 */
function calculateBasePrice(volumeCm3, unitPrice) {
  if (!volumeCm3 || !unitPrice) return 0;
  return Math.round((volumeCm3 * 1.27 * unitPrice) / 1000) * 1000;
}

/* ─── Mock 분석 ─── */
function runMockAnalysis(file) {
  const seed = file.name.length + Math.floor(file.size / 1000);
  const r = (n) => ((seed * (n + 1) * 9301 + 49297) % 233280) / 233280;

  const dimX = +(40 + r(1) * 120).toFixed(1);
  const dimY = +(30 + r(2) * 100).toFixed(1);
  const dimZ = +(25 + r(3) * 80).toFixed(1);

  const fillRatio = 0.25 + r(4) * 0.45;
  const volumeMm3 = +(dimX * dimY * dimZ * fillRatio).toFixed(2);
  const volumeCm3 = +(volumeMm3 / 1000).toFixed(3);

  const surfaceMm2 = +(volumeMm3 * (4 + r(5) * 3) / 10).toFixed(1);
  const complexity = Math.round(30 + r(6) * 60);
  const needsSplit = dimX > 350 || dimY > 350 || dimZ > 300;

  // 리스크는 Open mesh/Hole + Thin wall 2종만 사용 (글룩 핵심)
  const risks = {
    holes:    r(9) > 0.55,   // 검출 빈도 높임 — 시각화가 핵심 기능이므로
    thinWall: r(10) > 0.6,
  };
  const riskCount = Object.values(risks).filter(Boolean).length;

  const supportDifficulty = Math.round(complexity * 0.6 + (risks.thinWall ? 25 : 0) + r(13) * 15);
  const hollowable = volumeCm3 > 30 && !risks.thinWall;

  const productionFitScore = Math.max(0, Math.min(100,
    Math.round(85 - (complexity > 75 ? 15 : 0) - riskCount * 8 - (needsSplit ? 20 : 0) - (risks.thinWall ? 12 : 0))
  ));

  const printabilityScore = Math.max(0, Math.min(100,
    Math.round(92 - riskCount * 9 - (risks.thinWall ? 8 : 0) - (risks.holes ? 8 : 0) - (needsSplit ? 10 : 0))
  ));

  return {
    dim: { x: dimX, y: dimY, z: dimZ },
    volumeMm3, volumeCm3, surfaceMm2,
    complexity, risks, riskCount,
    needsSplit,
    supportDifficulty,
    hollowable,
    productionFitScore,
    printabilityScore,
  };
}

function scoreToStatus(score) {
  if (score >= 90) return { label: '출력 적합성 높음', tone: 'success', message: 'SLA 출력 적합성이 높습니다.' };
  if (score >= 70) return { label: '검토 필요', tone: 'warning', message: '출력 가능성이 높지만 일부 설계 검토가 권장됩니다.' };
  if (score >= 50) return { label: 'DfAM 권장', tone: 'caution', message: 'DfAM 검토를 권장합니다.' };
  return { label: '상담 필요', tone: 'danger', message: '제조성 검토가 필요합니다.' };
}

/* ─── DfM 검사 항목 (글룩 핵심 2종) ───
 * Open mesh/Hole: boundary edge 존재 → 출력 시 누수·서포트 부착 불량
 * Thin wall:     0.6mm 미만 영역 → 출력 후 파손 위험
 *
 * 검출 결과는 "검토 필요"(warning) 또는 "위험"(critical)으로 표시
 *   - 검토 필요: 단일 edge·소량 thin wall → 정식 검토 시 보정 가능
 *   - 위험:    다수 boundary loop·심한 thin wall → 설계 수정 권장
 */
const RISK_ITEMS = [
  { key: 'holes',    label: 'Open mesh / Hole', desc: 'Boundary edge · 열린 면',         critical: true },
  { key: 'thinWall', label: 'Thin wall',        desc: '0.6mm 미만 영역 · 파손 위험',     critical: true },
];

function getRiskMessages(analysis) {
  if (!analysis) return [];
  const msgs = [];
  const r = analysis.risks;
  if (r.holes) msgs.push('모델에 열린 구멍 또는 면이 뚫린 부분이 감지되었습니다.');
  if (r.thinWall) msgs.push('0.6mm 미만의 얇은 벽이 있어 출력 시 파손 위험이 있습니다.');
  if (analysis.needsSplit) msgs.push('표준 빌드 사이즈를 초과해 분할 출력이 필요합니다.');
  return msgs;
}

/* ───────────────────────────────────────────
   3D Viewer — 사이즈 박스 + 그리드 + 오류 빨간 하이라이트

function ModelViewer({ part, viewMode }) {
  const containerRef = useRef(null);
  const stateRef = useRef({});

  useEffect(() => {
    if (!containerRef.current || !part?.file) return;
    const container = containerRef.current;

    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // ─── Lights (v1 style — 부드러운 보라톤 + 형상 굴곡 잘 보임) ───

    const dir1 = new THREE.DirectionalLight(0xffffff, 0.85);
    dir1.position.set(5, 8, 5);
    scene.add(dir1);
    const dir2 = new THREE.DirectionalLight(0x6b9fff, 0.35);
    dir2.position.set(-4, -2, 3);
    scene.add(dir2);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;          // v1 스타일 - 자동 회전

    // 픽셀 분석으로 추출한 실제 글자 형태 (16x14 grid)

      'G': { widthRatio: 1.000, rects: [

        [0,5,8,1],[0,6,8,1],[0,7,8,1],[0,8,8,1],[0,9,8,1],
        [0,10,8,1],[0,11,16,1],[0,12,16,1],[0,13,16,1]

      'U': { widthRatio: 0.885, rects: [
        [0,0,4,1],[12,0,4,1],[0,1,4,1],[12,1,4,1],[0,2,4,1],
        [12,2,4,1],[0,3,4,1],[12,3,4,1],[0,4,4,1],[12,4,4,1],
        [0,5,4,1],[12,5,4,1],[0,6,4,1],[12,6,4,1],[0,7,4,1],
        [12,7,4,1],[0,8,4,1],[12,8,4,1],[0,9,5,1],[12,9,4,1],
        [0,10,5,1],[11,10,5,1],[1,11,14,1],[2,12,12,1],[4,13,8,1]
      ]},
      'C': { widthRatio: 0.852, rects: [
        [5,0,7,1],[3,1,11,1],[2,2,13,1],[1,3,5,1],[11,3,5,1],
        [0,4,5,1],[12,4,4,1],[0,5,4,1],[0,6,4,1],[0,7,4,1],
        [0,8,4,1],[13,8,3,1],[0,9,5,1],[12,9,4,1],[1,10,5,1],
        [11,10,5,1],[2,11,13,1],[3,12,11,1],[5,13,7,1]
      ]},
      'K': { widthRatio: 0.934, rects: [
        [0,0,4,1],[11,0,4,1],[0,1,4,1],[9,1,6,1],[0,2,4,1],
        [8,2,5,1],[0,3,4,1],[7,3,5,1],[0,4,4,1],[6,4,4,1],
        [0,5,9,1],[0,6,10,1],[0,7,11,1],[0,8,5,1],[7,8,5,1],
        [0,9,4,1],[8,9,5,1],[0,10,4,1],[8,10,5,1],[0,11,4,1],
        [9,11,5,1],[0,12,4,1],[10,12,5,1],[0,13,4,1],[11,13,5,1]
      ]}
    };

    const logoGroup = new THREE.Group();
    const logoMat = new THREE.MeshStandardMaterial({
      color: 0x1A1D24,  // gluck-dark-3 (검은색에 가까운 진한 회색)
      roughness: 0.55,
      metalness: 0.2,
    });

    // 로고 단위 변환:
    // - 전체 로고 너비 약 1.6 (그리드 단위) → 약 40mm
    // - 글자 높이 약 0.5 (그리드 단위) → 약 12mm
    // - 글자 깊이(두께) 0.08 → 약 2mm (살짝 입체감)
    const LETTER_HEIGHT = 0.5;      // Y축 (세로)
    const LETTER_THICKNESS = 0.08;  // Z축 (앞뒤 두께)
    const CELL_H = LETTER_HEIGHT / 14;  // 그리드 한 셀 높이

    const letterOrder = ['G', 'L', 'U', 'C', 'K'];
    const letterGap = LETTER_HEIGHT * 0.10;  // 글자 간격
    let xCursor = 0;

    letterOrder.forEach((char) => {
      const data = GLUCK_LOGO_DATA[char];
      // 글자 너비: widthRatio 기준 (G가 1.0일 때 LETTER_HEIGHT의 약 1.05배)
      const letterWidth = LETTER_HEIGHT * 1.05 * data.widthRatio;
      const cellW = letterWidth / 16;

      data.rects.forEach(([rx, ry, rw, rh]) => {
        const boxW = cellW * rw;
        const boxH = CELL_H * rh;
        const geo = new THREE.BoxGeometry(boxW, boxH, LETTER_THICKNESS);
        const m = new THREE.Mesh(geo, logoMat);
        // 박스 중심 좌표:
        // - X: xCursor + (rx + rw/2) * cellW
        // - Y: 글자 높이는 위에서 아래로 — 상단 기준 (LETTER_HEIGHT - ry*CELL_H - boxH/2)
        // - Z: 0 (앞뒤 가운데)
        m.position.set(
          xCursor + (rx + rw / 2) * cellW,
          LETTER_HEIGHT - (ry + rh / 2) * CELL_H,
          0
        );
        logoGroup.add(m);
      });

      xCursor += letterWidth + letterGap;
    });

    // logoGroup 자체를 빌드 플레이트 좌측 앞쪽 코너에 배치
    // - 카메라가 +X/+Z 방향에서 봄 → 좌측 앞쪽 = (-X, +Z) 모서리
    // - 로고는 카메라를 향해 약간 살짝 틀어진 각도로 세움 (Y축 회전)
    logoGroup.position.set(
      -gridSize / 2 + 0.4,                    // 좌측 모서리에서 안쪽으로
      0,                                       // 그리드 위에 바로 (글자 바닥이 Y=0)
      gridSize / 2 - LETTER_THICKNESS / 2 - 0.6  // 앞쪽 모서리에서 안쪽으로
    );
    // 카메라 쪽으로 살짝 틀어주기 (-Y축으로 약 30° 회전)
    logoGroup.rotation.y = -Math.PI / 6;
    gridGroup.add(logoGroup);

    scene.add(gridGroup);

    let mesh = null;
    let bboxLines = null;
    let dimLabels = [];
    let mounted = true;

    const setupMesh = (geometry) => {
      if (!mounted) return;
      geometry.computeBoundingBox();
      const center = new THREE.Vector3();
      geometry.boundingBox.getCenter(center);
      geometry.translate(-center.x, -center.y, -center.z);
      const size = new THREE.Vector3();
      geometry.boundingBox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.5 / maxDim;
      geometry.scale(scale, scale, scale);

      // 바닥에 정렬 (Y=0 기준)
      geometry.computeBoundingBox();
      const newSize = new THREE.Vector3();
      geometry.boundingBox.getSize(newSize);
      geometry.translate(0, newSize.y / 2, 0);
      geometry.computeVertexNormals();

      // 메인 mesh
      const hasHoles = part.analysis && part.analysis.risks?.holes;
      const hasThinWall = part.analysis && part.analysis.risks?.thinWall;

      const isTransparent = viewMode === 'transparent';
      const material = new THREE.MeshStandardMaterial({
        color: part.material.color,
        roughness: isTransparent ? 0.25 : 0.42,
        metalness: isTransparent ? 0.08 : 0.18,
        transparent: isTransparent,
        opacity: isTransparent ? 0.32 : 1,
        side: isTransparent ? THREE.DoubleSide : THREE.FrontSide,
        depthWrite: !isTransparent,
      });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
      // 투명 모드는 순수 반투명 글래스 효과 (와이어 overlay 없음)
      // - opacity 0.32 + DoubleSide + depthWrite false
      //   → 내부 면이 자연스럽게 비쳐 보임
      //   → 외곽선·내부 폴리곤 라인 없이 깨끗

      // ─── Open mesh / Hole 시각화 (진짜 boundary edge만 검출) ───
      //
      // 핵심 원칙:
      // 1) STL/OBJ 메시에서 edge가 정확히 1개 face에만 속하면 = boundary edge (= open mesh)
      // 2) 정상 닫힌 메시는 모든 edge가 정확히 2개 face에 속함
      // 3) 닫힌 메시면 빨간 표시 0개 (false positive 없음)
      // 4) 진짜 hole이 있는 메시(예: 면이 빠진 STL)만 boundary edge 검출됨
      //
      // 좌표 기반 해싱: STL은 vertex index가 중복돼도 좌표가 같으면 같은 vertex로 취급
      if (hasHoles) {
        try {
          const positions = geometry.attributes.position.array;
          const indices = geometry.index ? geometry.index.array : null;
          const faceCount = indices ? indices.length / 3 : positions.length / 9;

          // 좌표 기반 vertex 키 (소수점 4자리 정밀도)
          const coordKey = (idx) => {
            const x = positions[idx * 3];
            const y = positions[idx * 3 + 1];
            const z = positions[idx * 3 + 2];
            return `${x.toFixed(4)}_${y.toFixed(4)}_${z.toFixed(4)}`;
          };

          // 모든 edge 카운트 (정렬된 좌표 키 사용)
          const edgeMap = new Map();
          const addEdge = (a, b) => {
            const ka = coordKey(a), kb = coordKey(b);
            const key = ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
            const existing = edgeMap.get(key);
            if (existing) {
              existing.count += 1;
            } else {
              edgeMap.set(key, { count: 1, idx0: a, idx1: b });
            }
          };

          for (let f = 0; f < faceCount; f++) {
            let i0, i1, i2;
            if (indices) {
              i0 = indices[f * 3]; i1 = indices[f * 3 + 1]; i2 = indices[f * 3 + 2];
            } else {
              i0 = f * 3; i1 = f * 3 + 1; i2 = f * 3 + 2;
            }
            addEdge(i0, i1);
            addEdge(i1, i2);
            addEdge(i2, i0);
          }

          // count === 1 인 edge만 boundary edge (= 진짜 open edge)
          const boundaryEdges = [];
          for (const [, edge] of edgeMap) {
            if (edge.count === 1) {
              boundaryEdges.push(edge);
            }
          }

          // 닫힌 메시 → boundary edge 0개 → 빨간 표시 안함 (false positive 방지)
          if (boundaryEdges.length === 0) {
            // 진짜 hole이 없음 → analysis.risks.holes 자동 보정
            // (UI 표시는 그대로 두되, 시각화만 안함)
            console.log('[Hole detection] 메시가 닫혀있어 boundary edge 없음 — 빨간 표시 생략');
          } else {
            // ─── 1) Boundary edge를 빨간 선으로 그리기 ───
            const edgeLineVerts = [];
            for (const edge of boundaryEdges) {
              edgeLineVerts.push(
                positions[edge.idx0 * 3],     positions[edge.idx0 * 3 + 1], positions[edge.idx0 * 3 + 2],
                positions[edge.idx1 * 3],     positions[edge.idx1 * 3 + 1], positions[edge.idx1 * 3 + 2]
              );
            }
            const edgeGeo = new THREE.BufferGeometry();
            edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgeLineVerts, 3));
            const edgeMat = new THREE.LineBasicMaterial({
              color: 0xFF2D2D,
              transparent: true,
              opacity: 0.95,
              depthTest: viewMode === 'transparent' ? false : true,
            });
            const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
            edgeLines.renderOrder = 999;
            scene.add(edgeLines);
            stateRef.current.boundaryEdgeLines = edgeLines;

            // ─── 2) Boundary edge들을 연결된 loop로 그룹화 → fan fill ───
            // 각 vertex 좌표 키 → 연결된 다른 vertex들
            const adjacency = new Map();
            const addAdj = (kA, kB, edgeRef) => {
              if (!adjacency.has(kA)) adjacency.set(kA, []);
              adjacency.get(kA).push({ key: kB, edge: edgeRef });
            };
            for (const edge of boundaryEdges) {
              const ka = coordKey(edge.idx0), kb = coordKey(edge.idx1);
              addAdj(ka, kb, edge);
              addAdj(kb, ka, edge);
            }

            // 연결된 컴포넌트(loop) 찾기 — flood fill
            const visited = new Set();
            const loops = [];
            for (const startKey of adjacency.keys()) {
              if (visited.has(startKey)) continue;
              const loopVerts = [];
              const queue = [startKey];
              while (queue.length > 0) {
                const k = queue.shift();
                if (visited.has(k)) continue;
                visited.add(k);
                const adj = adjacency.get(k) || [];
                // 이 vertex의 좌표를 기록
                for (const a of adj) {
                  // 첫 edge에서 좌표 추출
                  const p = a.edge.idx0;
                  const px = positions[p * 3];
                  const py = positions[p * 3 + 1];
                  const pz = positions[p * 3 + 2];
                  const pKey = `${px.toFixed(4)}_${py.toFixed(4)}_${pz.toFixed(4)}`;
                  if (pKey === k) {
                    loopVerts.push({ key: k, x: px, y: py, z: pz });
                  } else {
                    const px2 = positions[a.edge.idx1 * 3];
                    const py2 = positions[a.edge.idx1 * 3 + 1];
                    const pz2 = positions[a.edge.idx1 * 3 + 2];
                    loopVerts.push({ key: k, x: px2, y: py2, z: pz2 });
                  }
                  if (!visited.has(a.key)) queue.push(a.key);
                  break; // 좌표 하나만 기록
                }
              }
              if (loopVerts.length >= 3) {
                loops.push(loopVerts);
              }
            }

            // ─── 3) 각 loop의 중심에서 fan triangulation으로 빨간 면 채우기 ───
            const patchVerts = [];
            for (const loop of loops) {
              // loop 중심
              let cx = 0, cy = 0, cz = 0;
              for (const v of loop) { cx += v.x; cy += v.y; cz += v.z; }
              cx /= loop.length; cy /= loop.length; cz /= loop.length;

              // boundary edge 단위로 fan triangle (loop는 순서 정렬이 아니라
              // 위에서 정확히 추출하지 못할 수 있음 → 안전하게 boundary edge로 직접 만듦)
              for (const edge of boundaryEdges) {
                const v0x = positions[edge.idx0 * 3];
                const v0y = positions[edge.idx0 * 3 + 1];
                const v0z = positions[edge.idx0 * 3 + 2];
                const v1x = positions[edge.idx1 * 3];
                const v1y = positions[edge.idx1 * 3 + 1];
                const v1z = positions[edge.idx1 * 3 + 2];
                // 이 edge가 이 loop에 속하는지 — loop 중심 거리로 간이 판정
                const eCx = (v0x + v1x) / 2;
                const eCy = (v0y + v1y) / 2;
                const eCz = (v0z + v1z) / 2;
                const dx = eCx - cx, dy = eCy - cy, dz = eCz - cz;
                // loop 평균 반경 추정
                let avgR = 0;
                for (const v of loop) {
                  const ddx = v.x - cx, ddy = v.y - cy, ddz = v.z - cz;
                  avgR += Math.sqrt(ddx*ddx + ddy*ddy + ddz*ddz);
                }
                avgR /= loop.length;
                const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
                if (d > avgR * 1.5) continue; // 다른 loop에 속하는 edge

                patchVerts.push(cx, cy, cz, v0x, v0y, v0z, v1x, v1y, v1z);
              }
            }

            if (patchVerts.length > 0) {
              const patchGeo = new THREE.BufferGeometry();
              patchGeo.setAttribute('position', new THREE.Float32BufferAttribute(patchVerts, 3));
              patchGeo.computeVertexNormals();
              const patchMat = new THREE.MeshBasicMaterial({
                color: 0xFF2D2D,
                transparent: true,
                opacity: viewMode === 'transparent' ? 0.7 : 0.55,
                side: THREE.DoubleSide,
                depthWrite: false,
                depthTest: viewMode === 'transparent' ? false : true,
              });
              const patchMesh = new THREE.Mesh(patchGeo, patchMat);
              patchMesh.renderOrder = 998;
              scene.add(patchMesh);
              stateRef.current.holePatch = patchMesh;
            }
          }
        } catch (e) {
          console.warn('Hole visualization failed', e);
        }
      }

      // ─── Thin wall 시각화 ───
      // 메시 위에 빨간 반투명 오버레이 (전체에 살짝)
      if (hasThinWall) {
        const thinWallMat = new THREE.MeshBasicMaterial({
          color: 0xFF6B6B,
          transparent: true,
          opacity: 0.18,
          side: THREE.DoubleSide,
        });
        const thinWallOverlay = new THREE.Mesh(geometry, thinWallMat);
        thinWallOverlay.scale.setScalar(1.003);
        scene.add(thinWallOverlay);
        stateRef.current.thinWallOverlay = thinWallOverlay;
      }

      // ─── Bounding Box (사이즈 박스, 검은 와이어프레임) ───
      const bboxGeo = geometry.boundingBox;
      const bbSize = new THREE.Vector3();
      bboxGeo.getSize(bbSize);
      const bbCenter = new THREE.Vector3();
      bboxGeo.getCenter(bbCenter);

      const boxLineGeo = new THREE.BoxGeometry(bbSize.x, bbSize.y, bbSize.z);
      const boxEdges = new THREE.EdgesGeometry(boxLineGeo);
      bboxLines = new THREE.LineSegments(
        boxEdges,
        new THREE.LineBasicMaterial({ color: 0x2D3139, linewidth: 1 })
      );
      bboxLines.position.copy(bbCenter);
      scene.add(bboxLines);

      // 카메라 위치 조정 (BBox + 그리드 모두 보이게)
      const r = Math.max(bbSize.x, bbSize.z) * 1.5 + 3;
      camera.position.set(r, bbSize.y * 1.2 + 2, r);
      controls.target.copy(bbCenter);
      controls.update();
    };

    const url = URL.createObjectURL(part.file);
    const ext = part.file.name.split('.').pop()?.toLowerCase();

    if (ext === 'stl') {
      const loader = new THREE.STLLoader();
      loader.load(url, (geo) => { setupMesh(geo); URL.revokeObjectURL(url); }, undefined, () => {
        setupMesh(new THREE.BoxGeometry(2, 2, 2));
        URL.revokeObjectURL(url);
      });
    } else if (ext === 'obj') {
      const loader = new THREE.OBJLoader();
      loader.load(url, (obj) => {
        if (!mounted) return;
        let firstGeo = null;
        obj.traverse((child) => { if (child.isMesh && !firstGeo) firstGeo = child.geometry; });
        if (firstGeo) setupMesh(firstGeo);
        else setupMesh(new THREE.BoxGeometry(2, 2, 2));
        URL.revokeObjectURL(url);
      }, undefined, () => {
        setupMesh(new THREE.BoxGeometry(2, 2, 2));
        URL.revokeObjectURL(url);
      });
    } else {
      // STEP/3MF/ZIP — placeholder cube
      setupMesh(new THREE.BoxGeometry(2, 2, 2));
      URL.revokeObjectURL(url);
    }

    const resize = () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    };
    const ro = new ResizeObserver(resize);
    ro.observe(container);

    const animate = () => {
      if (!mounted) return;
      controls.update();
      renderer.render(scene, camera);
      stateRef.current.frameId = requestAnimationFrame(animate);
    };
    animate();

    return () => {
      mounted = false;
      cancelAnimationFrame(stateRef.current.frameId);
      ro.disconnect();
      controls.dispose();
      if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
      if (bboxLines) { scene.remove(bboxLines); bboxLines.geometry.dispose(); bboxLines.material.dispose(); }
      if (stateRef.current.holePatch) {
        scene.remove(stateRef.current.holePatch);
        stateRef.current.holePatch.geometry.dispose();
        stateRef.current.holePatch.material.dispose();
      }
      if (stateRef.current.boundaryEdgeLines) {
        scene.remove(stateRef.current.boundaryEdgeLines);
        stateRef.current.boundaryEdgeLines.geometry.dispose();
        stateRef.current.boundaryEdgeLines.material.dispose();
      }
      if (stateRef.current.thinWallOverlay) {
        scene.remove(stateRef.current.thinWallOverlay);
        stateRef.current.thinWallOverlay.material.dispose();
      }
      scene.remove(gridGroup);
      grid.geometry?.dispose?.();
      grid.material?.dispose?.();
      plateGeo.dispose();
      plateMat.dispose();
      // GLUCK 3D 로고 정리
      logoGroup.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
      });
      logoMat.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode === container) container.removeChild(renderer.domElement);
    };
  }, [part?.id, part?.material?.color, viewMode, part?.analysis?.risks?.holes, part?.analysis?.risks?.thinWall]);

  return <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing" />;
}

/* ─── Stepper ─── */
function Stepper({ currentStep }) {
  const steps = [
    { num: 1, label: '파일 업로드' },
    { num: 2, label: '옵션 설정' },
    { num: 3, label: '견적 산출' },
  ];
  return (
    <div className="flex items-center gap-2 md:gap-3 flex-wrap">
      {steps.map((s, i) => (
        <Fragment key={s.num}>
          <div className={`inline-flex items-center gap-2 px-3 md:px-3.5 py-1.5 rounded-full transition-all ${
            currentStep === s.num
              ? 'bg-gluck-blue text-white'
              : currentStep > s.num
              ? 'bg-gluck-blue-light text-gluck-blue'
              : 'bg-gluck-gray-superlight text-gluck-dark'
          }`}>
            <span className={`flex items-center justify-center w-5 h-5 rounded-full text-[10.5px] font-bold tnum ${
              currentStep === s.num
                ? 'bg-white text-gluck-blue'
                : currentStep > s.num
                ? 'bg-gluck-blue text-white'
                : 'bg-white text-gluck-dark border border-gluck-border'
            }`}>
              {currentStep > s.num ? <Icon name="check" className="w-3 h-3" strokeWidth={3} /> : s.num}
            </span>
            <span className="text-[12.5px] font-semibold tracking-[-0.005em]">{s.label}</span>
          </div>
          {i < steps.length - 1 && <div className="w-4 md:w-6 h-px bg-gluck-border" />}
        </Fragment>
      ))}
    </div>
  );
}

/* ──────────────────────────────────────────────────
   메인 컴포넌트 — 멀티 파트 프로젝트
   ────────────────────────────────────────────────── */
function InstantQuotePage() {
  // 데이터 모델: parts: Part[]
  // Part 구조:
  //   { id, partNumber, file, fileName, fileSize,
  //     status: 'analyzing' | 'ready',
  //     analysis: {...} | null,
  //     material, color, quantity, hollow,
  //     unitPrice, totalPrice  (견적 산출 후 계산)
  //   }
  const [parts, setParts] = useState([]);
  const [selectedPartId, setSelectedPartId] = useState(null);

  const [viewMode, setViewMode] = useState('solid'); // solid | transparent (와이어 제거)
  const [isDragOver, setIsDragOver] = useState(false);
  const [fileSizeError, setFileSizeError] = useState(null);
  const [stlCheckModalState, setStlCheckModalState] = useState({ open: false, partId: null });
  const [materialDropdownOpen, setMaterialDropdownOpen] = useState(false);
  const [analysisOpen, setAnalysisOpen] = useState(false);
  const [crmDebugOpen, setCrmDebugOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const fileInputRef = useRef(null);
  const dropdownRef = useRef(null);

  useEffect(() => {
    const handler = (e) => {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setMaterialDropdownOpen(false);
      }
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const showToast = (msg, type = 'info') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2400);
  };

  /* 선택된 파트 */
  const selectedPart = useMemo(() =>
    parts.find((p) => p.id === selectedPartId) || null
  , [parts, selectedPartId]);

  /* 모든 파트가 견적 산출됐는지 */
  const allCalculated = parts.length > 0 && parts.every((p) => p.totalPrice > 0);

  /* 현재 단계 */
  const currentStep = useMemo(() => {
    if (parts.length === 0) return 1;
    if (allCalculated) return 3;
    return 2;
  }, [parts, allCalculated]);

  /* ─── 파일 업로드 (다중) ─── */
  const processFiles = (filesArr) => {
    const validFiles = [];
    const oversized = [];
    const unsupported = [];

    Array.from(filesArr).forEach((f) => {
      const ext = f.name.split('.').pop()?.toLowerCase();
      if (!SUPPORTED_EXTS.includes(ext)) {
        unsupported.push(f);
      } else if (f.size > MAX_FILE_SIZE_BYTES) {
        oversized.push(f);
      } else {
        validFiles.push(f);
      }
    });

    if (oversized.length > 0) {
      setFileSizeError({
        files: oversized.map((f) => ({ name: f.name, size: f.size })),
      });
    }
    if (unsupported.length > 0) {
      showToast(`지원하지 않는 형식 ${unsupported.length}개 제외`, 'error');
    }

    if (validFiles.length === 0) return;

    /**
     * @backend-integration
     * 실제: Promise.all(files.map(f => uploadAndAnalyze(f)))
     */
    setParts((prev) => {
      const startNum = prev.length + 1;
      const newParts = validFiles.map((f, i) => ({
        id: `part_${Date.now()}_${i}_${Math.random().toString(36).substr(2, 5)}`,
        partNumber: startNum + i,
        file: f,
        fileName: f.name,
        fileSize: f.size,
        status: 'analyzing',
        analysis: null,
        material: MATERIAL_OPTIONS[0],
        quantity: 1,
        hollow: false,
        unitPrice: 0,
        totalPrice: 0,
      }));
      // 첫 업로드면 첫 파트 자동 선택
      if (prev.length === 0 && newParts.length > 0) {
        setSelectedPartId(newParts[0].id);
      }
      const merged = [...prev, ...newParts];

      // 분석 트리거 (각 파트 비동기)
      newParts.forEach((p) => {
        const delay = 1500 + Math.random() * 1000;
        setTimeout(() => {
          const result = runMockAnalysis(p.file);
          setParts((current) => current.map((cp) =>
            cp.id === p.id ? { ...cp, status: 'ready', analysis: result } : cp
          ));
          // 첫 파트 분석 완료 시 리스크 있으면 모달
          if (validFiles.length === 1 && (result.riskCount > 0 || result.needsSplit)) {
            setStlCheckModalState({ open: true, partId: p.id });
          }
        }, delay);
      });

      return merged;
    });

    showToast(`${validFiles.length}개 파일 업로드 — 분석 시작`, 'success');
  };

  const handleFileChange = (e) => {
    if (e.target.files?.length) processFiles(e.target.files);
    if (fileInputRef.current) fileInputRef.current.value = '';
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragOver(false);
    if (e.dataTransfer.files?.length) processFiles(e.dataTransfer.files);
  };

  /* ─── 파트 조작 ─── */
  const updatePart = (partId, updater) => {
    setParts((prev) => prev.map((p) => {
      if (p.id !== partId) return p;
      const updated = typeof updater === 'function' ? updater(p) : { ...p, ...updater };
      // 옵션 변경 시 견적 무효화
      return { ...updated, unitPrice: 0, totalPrice: 0 };
    }));
  };

  const removePart = (partId) => {
    setParts((prev) => {
      const filtered = prev.filter((p) => p.id !== partId);
      // 선택된 파트 삭제 시 다른 파트로 이동
      if (selectedPartId === partId) {
        setSelectedPartId(filtered[0]?.id || null);
      }
      return filtered;
    });
  };

  const duplicatePart = (partId) => {
    setParts((prev) => {
      const original = prev.find((p) => p.id === partId);
      if (!original) return prev;
      const newPart = {
        ...original,
        id: `part_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
        partNumber: prev.length + 1,
        unitPrice: 0,
        totalPrice: 0,
      };
      return [...prev, newPart];
    });
    showToast('파트가 복제되었습니다', 'success');
  };

  const handleRemoveAll = () => {
    setParts([]);
    setSelectedPartId(null);
  };

  /* ─── 견적 계산 (선택 파트) ─── */
  const handleCalculatePart = (partId) => {
    setParts((prev) => prev.map((p) => {
      if (p.id !== partId) return p;
      if (!p.analysis) return p;
      const effectiveVolume = p.hollow ? p.analysis.volumeCm3 * 0.65 : p.analysis.volumeCm3;
      const unitBasePrice = calculateBasePrice(effectiveVolume, p.material.unitPrice);
      const totalPrice = unitBasePrice * p.quantity;
      return { ...p, unitPrice: unitBasePrice, totalPrice };
    }));
  };

  /* ─── 모든 파트 일괄 견적 ─── */
  const handleCalculateAll = () => {
    parts.forEach((p) => {
      if (p.status === 'ready') handleCalculatePart(p.id);
    });
    showToast('모든 파트 견적이 산출되었습니다', 'success');
  };

  /* ─── 합산 ─── */
  const projectTotal = useMemo(() => {
    const sum = parts.reduce((acc, p) => acc + (p.totalPrice || 0), 0);
    const totalQty = parts.reduce((acc, p) => acc + p.quantity, 0);
    // 예상 납기: 파트 개수와 총 수량 기반 mock
    const baseLeadDays = 5;
    const extraDays = Math.ceil(parts.length / 3) + (totalQty > 100 ? 3 : 0);
    return {
      sum,
      totalQty,
      partCount: parts.length,
      leadDays: sum > 0 ? baseLeadDays + extraDays : null,
    };
  }, [parts]);

  /* ─── CRM 데이터 (멀티 파트) ─── */
  const crmData = useMemo(() => ({
    projectId: 'PRJ-' + Date.now(),
    createdAt: new Date().toISOString(),
    partCount: parts.length,
    totalQuantity: projectTotal.totalQty,
    estimatedTotalPrice: projectTotal.sum,
    estimatedLeadDays: projectTotal.leadDays,
    parts: parts.map((p) => ({
      partNumber: p.partNumber,
      fileName: p.fileName,
      fileSize: p.fileSize,
      dim: p.analysis?.dim || null,
      volumeMm3: p.analysis?.volumeMm3 || null,
      printabilityScore: p.analysis?.printabilityScore || null,
      riskCount: p.analysis?.riskCount || 0,
      material: p.material.code,
      quantity: p.quantity,
      hollow: p.hollow,
      unitPrice: p.unitPrice,
      totalPrice: p.totalPrice,
    })),
  }), [parts, projectTotal]);

  const stlRiskMessages = useMemo(() => {
    if (!stlCheckModalState.partId) return [];
    const p = parts.find((x) => x.id === stlCheckModalState.partId);
    return p ? getRiskMessages(p.analysis) : [];
  }, [stlCheckModalState, parts]);

  return (
    <div className="bg-gluck-gray-superlight min-h-screen text-gluck-dark-3">

      {/* ═════════════════════ HEADER ═════════════════════ */}
      <header className="bg-white border-b border-gluck-border h-[72px] flex items-center px-6 md:px-10 sticky top-0 z-40">
        <button className="flex items-center gap-2.5 text-[13px] font-medium text-gluck-dark-3 tracking-[0.06em]">
          <Icon name="menu" className="w-4 h-4" strokeWidth={2.5} />
          MENU
        </button>
        <div className="absolute left-1/2 -translate-x-1/2 font-extrabold tracking-[0.08em] text-[22px] text-gluck-dark-3">
          GLUCK
        </div>
        <div className="ml-auto flex items-center gap-3 md:gap-4">
          <button className="bg-gluck-blue text-white text-[13px] font-semibold px-4 h-9 rounded-lg hover:bg-gluck-blue-tone-up active:bg-gluck-blue-tone-down transition-colors">
            바로 견적 요청
          </button>
          <a href="#" className="text-[14px] font-medium text-gluck-dark-3 hover:text-gluck-blue transition-colors hidden md:inline">로그인</a>
          <span className="hidden md:flex items-center gap-1.5 text-[13px] text-gluck-dark pl-3 border-l border-gluck-border">
            <Icon name="globe" className="w-3.5 h-3.5" />
            <Icon name="chevronDown" className="w-3 h-3" />
          </span>
        </div>
      </header>

      {/* ═════════════════════ MAIN ═════════════════════ */}
      <main className="max-w-[1500px] mx-auto px-4 md:px-8 pt-6 md:pt-8 pb-16">

        {/* Stepper + NDA */}
        <div className="mb-5 flex items-center justify-between gap-4 flex-wrap">
          <Stepper currentStep={currentStep} />
          <div className="flex items-center gap-3 text-[12px] text-gluck-dark">
            {parts.length > 0 && (
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-white border border-gluck-border rounded-md">
                <Icon name="package" className="w-3 h-3 text-gluck-blue" />
                <span className="font-semibold text-gluck-dark-2 tnum">{parts.length}개 파트</span>
              </span>
            )}
            <span className="inline-flex items-center gap-1.5">
              <Icon name="shield" className="w-3.5 h-3.5 text-gluck-gray" />
              <span>NDA 대응 · 24h 자동 폐기</span>
            </span>
          </div>
        </div>

        {/* Main Card */}
        <div className="bg-white rounded-[20px] border border-gluck-border shadow-[0_1px_3px_rgba(0,0,0,0.04)] overflow-hidden">

          {parts.length === 0 ? (
            /* ╔══ 업로드 상태 (파트 0개) ══╗ */
            <div
              onClick={() => fileInputRef.current?.click()}
              onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
              onDragLeave={() => setIsDragOver(false)}
              onDrop={handleDrop}
              className={`relative min-h-[440px] m-6 lg:m-8 border-2 border-dashed rounded-2xl flex flex-col items-center justify-center transition-all cursor-pointer group ${
                isDragOver
                  ? 'bg-gluck-blue-light/30 border-gluck-blue border-solid'
                  : 'bg-gluck-gray-superlight/60 border-gluck-border hover:bg-white hover:border-gluck-blue'
              }`}
            >
              <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" multiple accept=".stl,.obj,.step,.stp,.3mf,.zip" />
              <div className="w-[80px] h-[80px] bg-white rounded-2xl shadow-[0_8px_24px_rgba(0,89,255,0.10),0_2px_8px_rgba(0,0,0,0.04)] flex items-center justify-center text-gluck-blue mb-6 border border-gluck-blue/10 group-hover:translate-y-[-2px] transition-transform duration-300">
                <Icon name="upload" className="w-8 h-8" strokeWidth={1.6} />
              </div>
              <p className="text-[20px] font-bold text-gluck-dark-3 mb-2.5 tracking-[-0.02em]">
                3D 파일을 여기에 드롭하거나 클릭하세요
              </p>
              <p className="text-[13.5px] text-gluck-dark font-medium mb-1.5">
                STL · OBJ · STEP · STP · 3MF · ZIP / 최대 100MB / 여러 파일 동시 가능
              </p>
              <button
                onClick={(e) => { e.stopPropagation(); fileInputRef.current?.click(); }}
                className="mt-5 h-12 px-6 bg-gluck-blue text-white rounded-[10px] font-semibold text-[14px] hover:bg-gluck-blue-tone-up active:bg-gluck-blue-tone-down transition-colors flex items-center gap-2"
              >
                컴퓨터에서 파일 선택
                <Icon name="arrow" className="w-4 h-4 opacity-70" />
              </button>
              <p className="text-[11px] text-gluck-dark text-center max-w-[480px] leading-[1.7] mt-5 px-4">
                업로드된 파일은 견적 검토 목적 외 사용되지 않으며, 24시간 후 자동 폐기됩니다.
              </p>
            </div>
          ) : (
            /* ╔══ 파트 1개+: Parts 사이드바 + 뷰어 + 옵션 ══╗ */
            <div className="grid grid-cols-1 lg:grid-cols-[260px_1fr_400px]">

              {/* ─── LEFT: Parts Sidebar ─── */}
              <PartsSidebar
                parts={parts}
                selectedPartId={selectedPartId}
                onSelect={setSelectedPartId}
                onRemove={removePart}
                onDuplicate={duplicatePart}
                onAddMore={() => fileInputRef.current?.click()}
                onRemoveAll={handleRemoveAll}
              />
              <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" multiple accept=".stl,.obj,.step,.stp,.3mf,.zip" />

              {/* ─── CENTER: 3D Viewer + 사이즈 박스 ─── */}
              <div className="p-6 lg:p-7 border-t lg:border-t-0 lg:border-x border-gluck-border bg-gluck-gray-superlight/30">
                {selectedPart ? (
                  <>
                    <div className="relative h-[440px] bg-white rounded-2xl border border-gluck-border overflow-hidden shadow-sm">

                      {/* View Mode Toggle (일반 / 투명만) */}
                      <div className="absolute top-4 left-4 z-10 inline-flex bg-white/95 backdrop-blur-sm rounded-lg p-1 shadow-md border border-gluck-border">
                        {[
                          { id: 'solid', label: '일반' },
                          { id: 'transparent', label: '투명' },
                        ].map((m) => (
                          <button
                            key={m.id}
                            onClick={() => setViewMode(m.id)}
                            className={`px-3.5 py-1.5 rounded-md text-[12px] font-semibold transition-all ${
                              viewMode === m.id
                                ? 'bg-gluck-dark-3 text-white'
                                : 'text-gluck-dark hover:text-gluck-dark-2'
                            }`}
                          >
                            {m.label}
                          </button>
                        ))}
                      </div>

                      {/* 분석중 또는 뷰어 */}
                      {selectedPart.status === 'analyzing' ? (
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                          <div className="relative w-14 h-14 mb-4">
                            <div className="absolute inset-0 border-4 border-gluck-blue/10 rounded-full" />
                            <div className="absolute inset-0 border-4 border-gluck-blue border-t-transparent rounded-full animate-spin" />
                          </div>
                          <p className="text-[14px] font-semibold text-gluck-dark-3">파일 분석 중...</p>
                          <p className="text-[10.5px] text-gluck-dark uppercase tracking-[0.12em] mt-1">
                            Parsing · Geometry · DfM Check
                          </p>
                        </div>
                      ) : (
                        <ModelViewer part={selectedPart} viewMode={viewMode} />
                      )}

                      {/* 좌측 상단: 파트 번호 라벨 (분석 완료 시) */}
                      {selectedPart.status === 'ready' && (
                        <div className="absolute top-4 right-4 z-10 inline-flex items-center gap-1.5 bg-gluck-dark-3 text-white text-[10.5px] font-semibold px-2.5 py-1.5 rounded-md shadow-md">
                          <Icon name="package" className="w-3 h-3" />
                          PART {String(selectedPart.partNumber).padStart(2, '0')}
                        </div>
                      )}

                      {/* 우상단 메타 카드 (DIMS / VOLUME / 오류) */}
                      {selectedPart.status === 'ready' && selectedPart.analysis && (
                        <div className="absolute bottom-4 left-4 right-4 z-10 grid grid-cols-3 gap-px bg-gluck-border/40 rounded-lg overflow-hidden border border-gluck-border/60 shadow-md">
                          <div className="bg-white/95 backdrop-blur-sm px-3 py-2.5">
                            <div className="text-[9.5px] font-semibold text-gluck-dark uppercase tracking-[0.12em] mb-0.5">FILE</div>
                            <div className="flex items-center gap-1">
                              <p className="text-[11px] font-semibold text-gluck-dark-3 truncate tnum flex-1" title={selectedPart.fileName}>
                                {selectedPart.fileName}
                              </p>
                              {selectedPart.analysis.riskCount > 0 && (
                                <button
                                  onClick={() => setStlCheckModalState({ open: true, partId: selectedPart.id })}
                                  className="text-amber-500 hover:text-amber-600 shrink-0"
                                  title="STL 검사 결과 보기"
                                >
                                  <Icon name="alertTriangle" className="w-3 h-3" strokeWidth={2.5} />
                                </button>
                              )}
                            </div>
                          </div>
                          <div className="bg-white/95 backdrop-blur-sm px-3 py-2.5">
                            <div className="text-[9.5px] font-semibold text-gluck-dark uppercase tracking-[0.12em] mb-0.5">DIMENSIONS</div>
                            <p className="text-[11px] font-semibold text-gluck-dark-3 tnum">
                              {selectedPart.analysis.dim.x} × {selectedPart.analysis.dim.y} × {selectedPart.analysis.dim.z} mm
                            </p>
                          </div>
                          <div className="bg-white/95 backdrop-blur-sm px-3 py-2.5">
                            <div className="text-[9.5px] font-semibold text-gluck-dark uppercase tracking-[0.12em] mb-0.5">VOLUME</div>
                            <p className="text-[11px] font-semibold text-gluck-dark-3 tnum">
                              {selectedPart.analysis.volumeMm3.toLocaleString()} mm³
                            </p>
                          </div>
                        </div>
                      )}

                      {/* 회전 안내 */}
                      {selectedPart.status === 'ready' && (
                        <div className="absolute top-1/2 right-4 -translate-y-1/2 z-10 inline-flex items-center gap-1.5 bg-gluck-dark-3/70 backdrop-blur-md text-white/85 text-[10px] font-semibold px-3 py-1.5 rounded-full pointer-events-none tracking-[0.12em] uppercase">
                          <Icon name="rotate" className="w-3 h-3" strokeWidth={2} />
                          ROTATE
                        </div>
                      )}
                    </div>

                    {/* 뷰어 하단 안내 */}
                    <div className="mt-4 flex items-center justify-between gap-3 text-[11.5px] text-gluck-dark flex-wrap">
                      <div className="flex items-center gap-2">
                        <Icon name="cube" className="w-3.5 h-3.5 text-gluck-gray" />
                        <span>검은 와이어 박스 · 사이즈 기준 / 바닥 grid · 1 cell ≈ 10mm / GLUCK 마크 · 약 40×12mm 스케일 비교</span>
                      </div>
                      {selectedPart.status === 'ready' && selectedPart.analysis && (
                        <div className="flex items-center gap-3">
                          {selectedPart.analysis.risks?.holes && (
                            <span className="inline-flex items-center gap-1.5 text-red-600">
                              <span className="w-3 h-3 bg-red-500/55 border border-red-500 rounded-sm" />
                              빨간 영역 · 뚫린 면(Hole)
                            </span>
                          )}
                          {selectedPart.analysis.risks?.thinWall && (
                            <span className="inline-flex items-center gap-1.5 text-amber-600">
                              <span className="w-3 h-3 bg-red-300/40 border border-red-300 rounded-sm" />
                              연빨강 · 얇은 벽
                            </span>
                          )}
                        </div>
                      )}
                    </div>

                    {/* Hole 검출 안내 — 빨간 영역이 있을 때만 노출 */}
                    {selectedPart.status === 'ready' && selectedPart.analysis?.risks?.holes && (
                      <div className="mt-3 p-3 bg-red-50 border border-red-200 rounded-lg flex gap-2.5 animate-[fadeIn_0.3s_ease]">
                        <Icon name="info" className="w-3.5 h-3.5 text-red-500 shrink-0 mt-0.5" strokeWidth={2.2} />
                        <p className="text-[11.5px] text-red-900 leading-[1.65]">
                          빨간 영역은 열린 면 또는 메시 경계가 감지된 구간입니다.
                          실제 출력 가능 여부는 정식 파일 검토 과정에서 재확인됩니다.
                        </p>
                      </div>
                    )}
                  </>
                ) : (
                  <div className="h-[440px] flex items-center justify-center text-gluck-dark text-[13px]">
                    좌측 Parts에서 파트를 선택해주세요
                  </div>
                )}
              </div>

              {/* ─── RIGHT: Options Panel (선택 파트 기준) ─── */}
              <div className="p-6 lg:p-7 bg-white border-t lg:border-t-0 border-gluck-border">
                {selectedPart && selectedPart.status === 'ready' ? (
                  <PartOptionsPanel
                    part={selectedPart}
                    materialDropdownOpen={materialDropdownOpen}
                    setMaterialDropdownOpen={setMaterialDropdownOpen}
                    dropdownRef={dropdownRef}
                    onUpdate={(patch) => updatePart(selectedPart.id, patch)}
                    onCalculate={() => handleCalculatePart(selectedPart.id)}
                    analysisOpen={analysisOpen}
                    setAnalysisOpen={setAnalysisOpen}
                  />
                ) : selectedPart ? (
                  <div className="flex flex-col items-center justify-center h-full text-center min-h-[300px]">
                    <div className="w-12 h-12 border-2 border-gluck-blue/20 border-t-gluck-blue rounded-full animate-spin mb-4" />
                    <p className="text-[13px] font-semibold text-gluck-dark-2 mb-1">파일 분석 중</p>
                    <p className="text-[11.5px] text-gluck-dark">잠시만 기다려주세요</p>
                  </div>
                ) : (
                  <div className="text-center text-gluck-dark text-[13px] pt-10">파트를 선택해주세요</div>
                )}
              </div>
            </div>
          )}

          {/* ═════ 하단 라이브러리 표 (전체 파트 + 합산) ═════ */}
          {parts.length > 0 && (
            <div className="border-t border-gluck-border bg-white p-6 lg:p-8 overflow-x-auto">
              <div className="min-w-[920px]">

                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-3">
                    <div className="w-1 h-6 bg-gluck-blue rounded-full" />
                    <h2 className="text-[15px] font-bold text-gluck-dark-3 tracking-[-0.01em]">
                      프로젝트 견적 요약
                      <span className="text-gluck-blue ml-2 text-[13px] tnum">({parts.length})</span>
                    </h2>
                  </div>
                  {!allCalculated && parts.some((p) => p.status === 'ready') && (
                    <button
                      onClick={handleCalculateAll}

                      <div className="flex items-center gap-2">
                        <p className={`text-[12px] font-semibold tracking-[-0.005em] tnum ${
                          part.material.id === mat.id ? 'text-gluck-blue' : 'text-gluck-dark-3'
                        }`}>
                          {mat.code}
                        </p>
                        {part.material.id === mat.id && (
                          <Icon name="check" className="w-3.5 h-3.5 text-gluck-blue" strokeWidth={2.5} />
                        )}
                      </div>
                      <p className="text-[10px] text-gluck-dark mt-0.5 truncate">{mat.description}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* 수량 */}
      <div className="mb-5">
        <label className="block text-[12px] font-semibold text-gluck-dark-2 mb-1.5">
          수량<span className="text-gluck-blue ml-0.5">*</span>
        </label>
        <div className="h-11 bg-white border border-gluck-border rounded-lg flex items-center">
          <button
            onClick={() => onUpdate({ quantity: Math.max(1, part.quantity - 1) })}
            className="w-11 h-full flex items-center justify-center text-gluck-dark-2 hover:bg-gluck-gray-superlight rounded-l-lg transition-colors"
          >
            <Icon name="minus" className="w-3.5 h-3.5" />
          </button>
          <input
            type="number"
            min={1}
            value={part.quantity}
            onChange={(e) => onUpdate({ quantity: Math.max(1, parseInt(e.target.value) || 1) })}
            className="flex-1 h-full text-center text-[14px] font-semibold text-gluck-dark-3 bg-transparent outline-none tnum"
          />
          <button
            onClick={() => onUpdate({ quantity: part.quantity + 1 })}
            className="w-11 h-full flex items-center justify-center text-gluck-dark-2 hover:bg-gluck-gray-superlight rounded-r-lg transition-colors"
          >
            <Icon name="plus" className="w-3.5 h-3.5" />
          </button>
        </div>
        {part.quantity >= 2 && (
          <div className={`mt-2 px-2.5 py-1.5 rounded-md flex items-start gap-1.5 transition-colors ${
            part.quantity >= 100
              ? 'bg-gluck-blue-light/40 border border-gluck-blue/15'
              : 'bg-gluck-gray-superlight/80 border border-gluck-border'
          }`}>
            <Icon
              name="factory"
              className={`w-3 h-3 shrink-0 mt-0.5 ${part.quantity >= 100 ? 'text-gluck-blue' : 'text-gluck-dark'}`}
            />
            <p className={`text-[10.5px] leading-relaxed ${part.quantity >= 100 ? 'text-gluck-dark-2' : 'text-gluck-dark'}`}>
              {part.quantity >= 100
                ? '100개 이상 — 양산 단가 상담 권장'
                : '100개 이상부터 양산 전용 단가가 적용될 수 있습니다.'}
            </p>
          </div>
        )}
      </div>

      {/* 속 비우기 */}
      <div className="mb-5">
        <div className="flex items-start justify-between gap-3 px-3 py-2.5 bg-white border border-gluck-border rounded-lg">
          <div>
            <p className="text-[12px] font-semibold text-gluck-dark-2 mb-0.5">속 비우기 적용</p>
            <p className="text-[10.5px] text-gluck-dark leading-relaxed">
              내부 비워 재료비 절감 (~35%)
            </p>
          </div>
          <button
            onClick={() => onUpdate({ hollow: !part.hollow })}
            className={`shrink-0 w-11 h-6 rounded-full transition-colors relative ${
              part.hollow ? 'bg-gluck-blue' : 'bg-gluck-gray-light'
            }`}
          >
            <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full shadow-sm transition-all ${
              part.hollow ? 'left-[22px]' : 'left-0.5'
            }`} />
          </button>
        </div>
      </div>

      {/* 견적 계산 + 가격 표시 */}
      <button
        onClick={onCalculate}
        disabled={!part.analysis}
        className="w-full h-12 bg-gluck-blue text-white rounded-lg font-semibold text-[14px] hover:bg-gluck-blue-tone-up active:bg-gluck-blue-tone-down transition-colors disabled:bg-gluck-gray disabled:cursor-not-allowed flex items-center justify-center gap-2 group"
      >
        {part.totalPrice > 0 ? '재계산' : '견적 계산하기'}
        <Icon name="arrow" className="w-4 h-4 opacity-70 group-hover:translate-x-0.5 transition-transform" />
      </button>

      {part.totalPrice > 0 && (
        <div className="mt-3 p-3 bg-gluck-gray-superlight/60 border border-gluck-border rounded-lg animate-[fadeIn_0.3s_ease]">
          <div className="flex items-baseline justify-between mb-1">
            <span className="text-[10px] font-semibold text-gluck-dark uppercase tracking-[0.12em]">파트 합계</span>
            <span className="text-[18px] font-bold text-gluck-dark-3 tnum tracking-[-0.01em]">
              ₩{part.totalPrice.toLocaleString()}
            </span>
          </div>
          <p className="text-[10.5px] text-gluck-dark text-right tnum">
            개당 ₩{part.unitPrice.toLocaleString()} × {part.quantity.toLocaleString()}
          </p>
        </div>
      )}

      {/* 상세 분석 아코디언 */}
      {part.analysis && status && (
        <div className="mt-4 border border-gluck-border rounded-lg overflow-hidden bg-white">
          <button
            onClick={() => setAnalysisOpen(!analysisOpen)}
            className="w-full flex items-center justify-between px-3.5 py-2.5 hover:bg-gluck-gray-superlight/60 transition-colors"
          >
            <div className="flex items-center gap-2">
              <Icon name="activity" className="w-3 h-3 text-gluck-blue" strokeWidth={2.2} />
              <span className="text-[12px] font-semibold text-gluck-dark-2">상세 분석</span>
              <span className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold tnum ${
                status.tone === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                status.tone === 'warning' ? 'bg-amber-50 text-amber-700 border border-amber-200' :
                status.tone === 'caution' ? 'bg-orange-50 text-orange-700 border border-orange-200' :
                'bg-red-50 text-red-700 border border-red-200'
              }`}>
                {part.analysis.printabilityScore}/100
              </span>
            </div>
            <Icon
              name="chevronDown"
              className={`w-3.5 h-3.5 text-gluck-dark transition-transform ${analysisOpen ? 'rotate-180' : ''}`}
            />
          </button>

          {analysisOpen && (
            <div className="border-t border-gluck-border bg-gluck-gray-superlight/30 p-3.5 space-y-3 animate-[fadeIn_0.25s_ease]">
              {/* DfM 항목 */}
              <div>
                <div className="text-[9.5px] font-semibold text-gluck-dark uppercase tracking-[0.12em] mb-1.5">
                  DfM 검사 ({part.analysis.riskCount === 0 ? '모두 통과' : `${part.analysis.riskCount}건 검토`})
                </div>
                <div className="bg-white rounded-md border border-gluck-border divide-y divide-gluck-border/60 overflow-hidden">
                  {RISK_ITEMS.map((item) => {
                    const detected = part.analysis.risks[item.key];
                    return (
                      <div key={item.key} className="flex items-center gap-2 px-2.5 py-1.5">
                        <Icon
                          name={detected ? (item.critical ? 'xCircle' : 'alert') : 'checkCircle'}
                          className={`w-3 h-3 shrink-0 ${
                            detected
                              ? item.critical ? 'text-red-500' : 'text-amber-500'
                              : 'text-emerald-500'
                          }`}
                          strokeWidth={2}
                        />
                        <p className="text-[10.5px] font-semibold text-gluck-dark-2 tnum flex-1">
                          {item.label}
                        </p>
                        <span className={`text-[9px] font-semibold uppercase tracking-[0.08em] ${
                          detected ? (item.critical ? 'text-red-500' : 'text-amber-600') : 'text-emerald-600'
                        }`}>
                          {detected ? (item.critical ? '위험' : '확인') : '양호'}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* 추가 정보 */}
              <div className="grid grid-cols-2 gap-1.5">
                <MetricMini label="표면적" value={`${part.analysis.surfaceMm2.toLocaleString()} mm²`} />
                <MetricMini label="복잡도" value={`${part.analysis.complexity}/100`} />
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ─── helpers ─── */
function MetricMini({ label, value }) {
  return (
    <div className="bg-white rounded-md border border-gluck-border px-2.5 py-1.5">
      <div className="text-[8.5px] font-semibold text-gluck-dark uppercase tracking-[0.1em] mb-0.5">
        {label}
      </div>
      <div className="text-[11px] font-bold text-gluck-dark-3 tracking-[-0.005em] tnum">
        {value}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<InstantQuotePage />);
</script>

</body>
</html>
